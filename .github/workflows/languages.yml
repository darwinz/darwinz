name: languages chart

on:
  # once a day; the indepth scan clones repos, so it runs less often than the stat cards
  schedule:
    - cron: "30 9 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      # metrics v3.34 stops paging after one batch of repos, so list them here instead
      - name: list source repos
        id: repos
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          list=$( { gh repo list darwinz --source --limit 1000 --json nameWithOwner --jq '.[].nameWithOwner'
                    gh repo list Fullspec-Studio --source --limit 1000 --json nameWithOwner --jq '.[].nameWithOwner'; } | paste -sd, -)
          echo "found $(echo "$list" | tr ',' '\n' | wc -l) repos"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # analyzes the code darwinz actually committed (private repos included) and
      # commits metrics.languages.svg to the `metrics` branch. The `output` branch
      # isn't used because the stat card workflow replaces its contents every run.
      - name: generate languages chart
        uses: lowlighter/metrics@v3.34
        with:
          # classic personal access token with the `repo` scope, saved as a repo secret
          token: ${{ secrets.METRICS_TOKEN }}
          user: darwinz
          filename: metrics.languages.svg
          committer_branch: metrics
          committer_message: "Update languages chart"
          base: ""
          config_timezone: America/Denver
          repositories: 20
          repositories_batch: 20
          repositories_affiliations: owner, organization_member
          commits_authoring: darwinz, Brandon Johnson, 13704128+darwinz@users.noreply.github.com, brandon@moov.io, brandon.johnson@moov.io
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: ${{ steps.repos.outputs.list }}
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 5
          debug: yes
