name: commit charts

on:
  # once a day; it clones every repo, so it runs less often than the stat cards
  schedule:
    - cron: "30 9 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # sums the lines darwinz added per language across every source repo,
      # private ones included. `gh auth setup-git` lets git clone with the
      # token through gh's credential helper, so it never goes in a URL.
      # The script prints counts only; repo names stay out of these public logs.
      - name: analyze committed code
        env:
          # classic personal access token with the `repo` scope, saved as a repo secret
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh auth setup-git
          python3 scripts/build_languages.py --out dist

      # the spectrum band in the README intro, with each layer's brightness set by
      # the last 90 days of commits (from dist/languages.json)
      - name: build spectrum band
        run: python3 scripts/build_spectrum.py --data dist/languages.json --out dist/spectrum.svg

      # the `output` branch isn't used because the stat card workflow replaces its contents every run
      - name: push charts to the metrics branch
        uses: crazy-max/ghaction-github-pages@v2.5.0
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
