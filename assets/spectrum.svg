<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172" role="img" aria-labelledby="title desc">
<title id="title">The full spectrum</title>
<desc id="desc">Systems Design: Distributed, Event-driven, API design, OpenAPI, gRPC, Protobuf; Infra: AWS, GCP, Terraform, Kubernetes, Docker, Vault; DevOps: GitHub Actions, Prometheus, Loki, Traefik, Packer, Linux; Data: Kafka, PostgreSQL, MySQL, Redis, Elasticsearch, Spark; AI: Claude, Bedrock, Agents, RAG, Evals, MCP; Backend: Go, Python, Node.js, Elixir, Ruby, Rust; Frontend: TypeScript, React, Vue, Swift, Dart, Next.js</desc>
<style>
  .tool { opacity: 0; animation: cycle 12s linear infinite; }
  @keyframes cycle {
    0% { opacity: 0; transform: translateY(5px); }
    3.00% { opacity: 1; transform: translateY(0); }
    13.67% { opacity: 1; transform: translateY(0); }
    16.67% { opacity: 0; transform: translateY(-5px); }
    100% { opacity: 0; }
  }
  .sheen { animation: sweep 9s ease-in-out infinite; }
  @keyframes sweep {
    0% { transform: translateX(-160px); }
    55% { transform: translateX(880px); }
    100% { transform: translateX(880px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool, .sheen { animation: none; }
    .tool.first { opacity: 1; }
  }
</style>
