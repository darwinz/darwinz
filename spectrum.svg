<title id="title">The full spectrum</title>
<desc id="desc">Share of my last 90 days of commits: Systems Design 14%; Infra 2%; DevOps 2%; Data 8%; AI 32%; Backend 19%; Frontend 23%. Systems Design: Distributed, Event-driven, API design, OpenAPI, gRPC, Protobuf; Infra: AWS, GCP, Terraform, Kubernetes, Docker, Vault; DevOps: GitHub Actions, Prometheus, Loki, Traefik, Packer, Linux; Data: Kafka, PostgreSQL, MySQL, Redis, Elasticsearch, Spark; AI: Claude, Bedrock, Agents, RAG, Evals, MCP; Backend: Go, Python, Node.js, Elixir, Ruby, Rust; Frontend: TypeScript, React, Vue, Swift, Dart, Next.js</desc>
<style>
  .tool { opacity: 0; animation: cycle 21s linear infinite; }
  @keyframes cycle {
    0% { opacity: 0; transform: translateY(5px); }
    3.00% { opacity: 1; transform: translateY(0); }
    13.67% { opacity: 1; transform: translateY(0); }
    16.67% { opacity: 0; transform: translateY(-5px); }
    100% { opacity: 0; }
  }
  .sheen { animation: sweep 9s ease-in-out infinite; }
  @keyframes sweep {
    0% { transform: translateX(-160px); }
    55% { transform: translateX(880px); }
    100% { transform: translateX(880px); }
  }
  .busiest { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool, .sheen, .busiest { animation: none; }
    .tool.first { opacity: 1; }
  }
</style>
